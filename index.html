<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bees Mart - Katalog Toko</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-32">

  <!-- Header -->
  <header class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-slate-100 z-20 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 bg-amber-400 rounded-xl flex items-center justify-center text-slate-900 font-extrabold text-lg shadow-sm">🐝</div>
        <div>
          <h1 class="font-bold text-base leading-tight text-slate-900">Bees Mart Jakarta Timur 1</h1>
          <p class="text-[10px] text-slate-500 font-medium">Katalog & Pemesanan Online</p>
        </div>
      </div>
      <!-- Tombol Kasir dengan Proteksi PIN -->
      <button onclick="aksesKasir()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-lg transition flex items-center gap-1.5">
        <i class="fa-solid fa-qrcode text-amber-500"></i> Kasir
      </button>
    </div>

    <!-- Search Box -->
    <div class="max-w-md mx-auto mt-3 relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input type="text" id="search" oninput="filterProduk()" placeholder="Cari nama barang..." 
        class="w-full bg-slate-100/80 border-0 pl-9 pr-4 py-2.5 rounded-xl text-sm focus:ring-2 focus:ring-amber-400 focus:bg-white outline-none transition placeholder:text-slate-400">
    </div>
  </header>

  <!-- Container Produk -->
  <main class="max-w-4xl mx-auto p-4">
    <div id="loading" class="text-center py-12">
      <div class="inline-block w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs text-slate-500 font-medium mt-3">Memuat produk...</p>
    </div>

    <div id="product-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5"></div>
  </main>

  <!-- Floating Cart Summary -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 p-4 shadow-2xl z-30 hidden">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-[11px] text-slate-500 font-medium"><span id="cart-count" class="font-bold text-amber-600">0</span> Barang dipilih</p>
        <p class="text-lg font-black text-slate-900" id="cart-total">Rp 0</p>
      </div>
      <button onclick="openModal()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-5 py-3 rounded-xl shadow-md transition flex items-center gap-2 active:scale-95 text-sm">
        <i class="fa-solid fa-cart-shopping"></i> Lanjut Pesan
      </button>
    </div>
  </div>

  <!-- Modal Checkout -->
  <div id="modal-checkout" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-xl animate-in slide-in-from-bottom duration-200 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <h3 class="font-bold text-slate-900 text-base">Detail Pemesanan</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="py-4 space-y-4">
        <!-- Nama Pemesan -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nama Pemesan:</label>
          <input type="text" id="nama-pemesan" placeholder="Masukkan nama kamu..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-amber-400">
        </div>

        <!-- Lokasi Pengambilan -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Lokasi Pengambilan Barang:</label>
          <div class="grid grid-cols-1 gap-2">
            <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-400 has-[:checked]:bg-amber-50 transition">
              <input type="radio" name="lokasi" value="Sekretariat Cibubur" checked class="accent-amber-500">
              <div>
                <p class="text-xs font-bold text-slate-800">Sekretariat Cibubur</p>
                <p class="text-[10px] text-slate-500">Ambil sendiri di kantor Cibubur</p>
              </div>
            </label>
            <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-400 has-[:checked]:bg-amber-50 transition">
              <input type="radio" name="lokasi" value="Pulogadung (Perhubungan)" class="accent-amber-500">
              <div>
                <p class="text-xs font-bold text-slate-800">Pulogadung (Perhubungan)</p>
                <p class="text-[10px] text-slate-500">Ambil sendiri di kantor Pulogadung</p>
              </div>
            </label>
          </div>
        </div>

        <!-- Tanggal Pengambilan -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Tanggal Pengambilan:</label>
          <input type="date" id="tanggal-pengambilan" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-amber-400">
        </div>
      </div>

      <button id="btn-checkout-wa" onclick="checkoutWA()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm active:scale-95 disabled:opacity-50">
        <i class="fa-brands fa-whatsapp text-lg"></i> Kirim Pesanan ke WhatsApp
      </button>
    </div>
  </div>

  <script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx7iQEVKtryDmAkBojsDvoPS6faRKwpTfdY4Is6LvE2nirmPqKXZ4SAyddwGeI7tVEK/exec"; 
  const NOMOR_WA = "628889976983";
  const PIN_KASIR = "494949"; // Ganti PIN Kasir sesuai keinginan kamu di sini

  let allProducts = [];
  let cart = {};

  // Auto set default tanggal ke hari ini
  document.getElementById("tanggal-pengambilan").valueAsDate = new Date();

  // Proteksi Fitur Kasir dengan PIN
  function aksesKasir() {
    const inputPin = prompt("Masukkan PIN Kasir Toko:");
    if (inputPin === PIN_KASIR) {
      window.location.href = "/kasir.html";
    } else if (inputPin !== null) {
      alert("PIN Salah! Fitur Kasir hanya untuk penjaga toko.");
    }
  }

  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      allProducts = data.map((item, index) => {
        const idUnik = (item.SKU && item.SKU !== 'NO-SKU' && item.SKU.trim() !== '') 
          ? item.SKU.toString().trim() 
          : 'PROD_' + index;
        return { ...item, idUnik: idUnik };
      });

      document.getElementById("loading").classList.add("hidden");
      renderProduk(allProducts);
    })
    .catch(err => {
      document.getElementById("loading").innerHTML = `<p class="text-xs text-red-500 font-semibold">Gagal memuat data.</p>`;
    });

  function renderProduk(list) {
    const container = document.getElementById("product-list");
    container.innerHTML = "";

    if (list.length === 0) {
      container.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-8">Produk tidak ditemukan.</p>`;
      return;
    }

    const fragment = document.createDocumentFragment();

    list.forEach(item => {
      const stok = Number(item.Stok) || 0;
      const stokAda = stok > 0;
      const qtyInCart = cart[item.idUnik] ? cart[item.idUnik].qty : 0;

      const card = document.createElement("div");
      card.className = "bg-white p-3 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between relative overflow-hidden";

      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between gap-1 mb-1.5">
            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">${item.SKU && item.SKU !== '' ? item.SKU : 'NO-SKU'}</span>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${stokAda ? (stok < 5 ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700') : 'bg-rose-100 text-rose-600'}">
              ${stokAda ? `Stok: ${stok}` : 'Habis'}
            </span>
          </div>
          <h3 class="font-bold text-slate-800 text-xs line-clamp-2 leading-snug">${item.Nama}</h3>
          <p class="text-[10px] text-slate-400 mt-0.5">${item.Berat || '-'}</p>
        </div>
        
        <div class="mt-3 pt-2 border-t border-slate-50 flex items-center justify-between gap-1">
          <p class="font-black text-slate-900 text-xs">Rp ${Number(item.Harga).toLocaleString('id-ID')}</p>
          <div id="btn-container-${item.idUnik}">
            ${renderActionButtons(item.idUnik, stok, qtyInCart)}
          </div>
        </div>
      `;
      fragment.appendChild(card);
    });

    container.appendChild(fragment);
  }

  function renderActionButtons(idUnik, stok, qty) {
    if (stok <= 0) {
      return `<button disabled class="bg-slate-100 text-slate-300 px-3 py-1 rounded-lg text-xs font-medium cursor-not-allowed">Habis</button>`;
    }
    if (qty === 0) {
      return `<button onclick="addToCart('${idUnik}')" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow-sm">+ Tambah</button>`;
    }
    return `
      <div class="flex items-center bg-slate-100 rounded-lg p-0.5 border border-amber-300">
        <button onclick="removeFromCart('${idUnik}')" class="bg-white text-slate-800 w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs shadow-sm hover:bg-slate-200 active:scale-90 transition">-</button>
        <span class="text-xs font-bold px-2 text-slate-900">${qty}</span>
        <button onclick="addToCart('${idUnik}')" class="bg-amber-400 hover:bg-amber-500 text-slate-900 w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs shadow-sm active:scale-90 transition">+</button>
      </div>`;
  }

  // OPTIMASI ANTI-LAG: Hanya update elemen tombol spesifik tanpa render ulang seluruh halaman
  function updateSingleButton(idUnik) {
    const item = allProducts.find(p => p.idUnik === idUnik);
    if (!item) return;
    const qty = cart[idUnik] ? cart[idUnik].qty : 0;
    const btnContainer = document.getElementById(`btn-container-${idUnik}`);
    if (btnContainer) {
      btnContainer.innerHTML = renderActionButtons(idUnik, Number(item.Stok) || 0, qty);
    }
  }

  function addToCart(idUnik) {
    const item = allProducts.find(p => p.idUnik === idUnik);
    if (!cart[idUnik]) cart[idUnik] = { ...item, qty: 0 };
    if (cart[idUnik].qty < item.Stok) {
      cart[idUnik].qty++;
      updateCartBar();
      updateSingleButton(idUnik);
    } else {
      alert("Stok maksimal tercapai!");
    }
  }

  function removeFromCart(idUnik) {
    if (cart[idUnik] && cart[idUnik].qty > 0) {
      cart[idUnik].qty--;
      if (cart[idUnik].qty === 0) delete cart[idUnik];
      updateCartBar();
      updateSingleButton(idUnik);
    }
  }

  function filterProduk() {
    const q = document.getElementById("search").value.toLowerCase();
    const filtered = allProducts.filter(p => p.Nama.toLowerCase().includes(q) || (p.SKU && p.SKU.toLowerCase().includes(q)));
    renderProduk(filtered);
  }

  function updateCartBar() {
    let total = 0;
    let count = 0;
    Object.values(cart).forEach(i => {
      total += i.Harga * i.qty;
      count += i.qty;
    });

    const cartBar = document.getElementById("cart-bar");
    if (count > 0) {
      cartBar.classList.remove("hidden");
      document.getElementById("cart-count").innerText = count;
      document.getElementById("cart-total").innerText = "Rp " + total.toLocaleString('id-ID');
    } else {
      cartBar.classList.add("hidden");
    }
  }

  function openModal() { document.getElementById("modal-checkout").classList.remove("hidden"); }
  function closeModal() { document.getElementById("modal-checkout").classList.add("hidden"); }

  // Checkout Instan + Kirim Data Latar Belakang (Anti Dobel Klik)
  function checkoutWA() {
    const nama = document.getElementById("nama-pemesan").value.trim();
    const tgl = document.getElementById("tanggal-pengambilan").value;

    if (!nama) { alert("Harap isi nama pemesan!"); return; }
    if (!tgl) { alert("Harap pilih tanggal pengambilan!"); return; }

    const btnWA = document.getElementById("btn-checkout-wa");
    btnWA.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Membuka WA...`;
    btnWA.disabled = true;

    const lokasi = document.querySelector('input[name="lokasi"]:checked').value;
    const tglFormatted = new Date(tgl).toLocaleDateString('id-ID', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    const itemsToDeduct = [];
    let rincianTextArr = [];
    let total = 0;

    Object.values(cart).forEach(i => {
      if (i.qty > 0) {
        const sub = i.Harga * i.qty;
        total += sub;
        itemsToDeduct.push({ sku: i.SKU, nama: i.Nama, qty: i.qty });
        rincianTextArr.push(`${i.Nama} (${i.qty}x)`);
      }
    });

    if (itemsToDeduct.length === 0) {
      alert("Keranjang belanjaan masih kosong!");
      btnWA.disabled = false;
      btnWA.innerHTML = `<i class="fa-brands fa-whatsapp text-lg"></i> Kirim Pesanan ke WhatsApp`;
      return;
    }

    // Format Pesan WA
    let text = `*PESANAN BARU - BEES MART*%0A`;
    text += `-----------------------------------%0A`;
    text += `👤 *Nama:* ${nama}%0A`;
    text += `📍 *Lokasi Ambil:* ${lokasi}%0A`;
    text += `📅 *Tanggal Ambil:* ${tglFormatted}%0A`;
    text += `-----------------------------------%0A%0A`;
    text += `*Rincian Barang:*%0A`;

    itemsToDeduct.forEach(i => {
      text += `• ${i.nama} (${i.qty}x)%0A`;
    });
    text += `%0A*TOTAL BAYAR: Rp ${total.toLocaleString('id-ID')}*%0A%0AMohon dikonfirmasi dan disiapkan ya kak!`;

    // 1. LANGSUNG BUKA WHATSAPP SEKETIKA
    window.open(`https://wa.me/${NOMOR_WA}?text=${text}`, '_blank');

    // 2. KIRIM DATA KE GOOGLE SHEET DI LATAR BELAKANG (POTONG STOK & CATAT PESANAN)
    fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        tipe: "Pemesanan Katalog (WA)",
        items: itemsToDeduct,
        pemesan: {
          nama: nama,
          lokasi: lokasi,
          tanggalAmbil: tglFormatted,
          rincianText: rincianTextArr.join(", "),
          totalBayar: total
        }
      })
    }).finally(() => {
      // Reset State & Tutup Modal
      cart = {};
      updateCartBar();
      closeModal();
      btnWA.disabled = false;
      btnWA.innerHTML = `<i class="fa-brands fa-whatsapp text-lg"></i> Kirim Pesanan ke WhatsApp`;
      location.reload();
    });
  }
  </script>
</body>
</html>
