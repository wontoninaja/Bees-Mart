<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir & Manajemen Stok - Bee's Mart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Library Scan Barcode Kamera -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bm-yellow: #f5a623;
      --bm-brown: #4a2c11;
      --bm-bg: #fdfbf7;
    }
    body { background-color: var(--bm-bg); color: #332211; }
    .bg-bm-brown { background-color: var(--bm-brown); }
    .text-bm-brown { color: var(--bm-brown); }
  </style>
</head>
<body class="antialiased pb-24">

  <!-- Header Kasir -->
  <header class="bg-bm-brown text-white p-4 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <img src="logo-bees-mart.jpg" alt="Logo" class="w-9 h-9 rounded-full border border-amber-400 object-cover bg-white" onerror="this.src='https://via.placeholder.com/100?text=BM'">
        <div>
          <h1 class="font-extrabold text-sm leading-tight text-amber-400">Kasir Bee's Mart</h1>
          <p class="text-[10px] text-amber-200">Sistem Kasir & Restock Stok</p>
        </div>
      </div>
      <a href="index.html" class="text-xs bg-amber-400 hover:bg-amber-500 text-bm-brown font-extrabold px-3 py-1.5 rounded-lg transition">
        <i class="fa-solid fa-store"></i> Katalog
      </a>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Mode Switcher -->
    <div class="grid grid-cols-2 gap-2 bg-amber-100/70 p-1 rounded-xl border border-amber-200">
      <button id="tab-kasir" onclick="switchMode('kasir')" class="py-2 rounded-lg text-xs font-black transition bg-bm-brown text-amber-400 shadow-sm flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-cart-shopping"></i> Mode Kasir
      </button>
      <button id="tab-restock" onclick="switchMode('restock')" class="py-2 rounded-lg text-xs font-black transition text-bm-brown hover:bg-amber-200/50 flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-boxes-packing"></i> Tambah Stok
      </button>
    </div>

    <!-- Banner Info Mode -->
    <div id="mode-info" class="bg-amber-50 border border-amber-300 p-3 rounded-xl flex items-center gap-2.5 text-xs text-bm-brown">
      <i id="mode-icon" class="fa-solid fa-circle-info text-amber-600 text-base"></i>
      <div>
        <p id="mode-title" class="font-bold">Mode Kasir Aktif</p>
        <p id="mode-desc" class="text-[10px] text-amber-800/80">Pilih/Scan barang yang dibeli pelanggan untuk memotong stok otomatis.</p>
      </div>
    </div>

    <!-- Area Pencarian + Tombol Kamera -->
    <div class="flex gap-2">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-amber-700/50 text-xs"></i>
        <input type="text" id="search" oninput="filterProduk()" placeholder="Cari nama barang / SKU..." 
          class="w-full bg-white border border-amber-200 pl-9 pr-4 py-2.5 rounded-xl text-sm text-bm-brown outline-none focus:ring-2 focus:ring-amber-400">
      </div>
      
      <button onclick="bukaKameraScanner()" class="bg-amber-400 hover:bg-amber-500 text-bm-brown px-3.5 rounded-xl font-bold border border-amber-300 shadow-sm active:scale-95 transition flex items-center justify-center gap-1.5 shrink-0">
        <i class="fa-solid fa-camera text-base"></i>
      </button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-8">
      <div class="inline-block w-6 h-6 border-3 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs text-bm-brown font-semibold mt-2">Memuat daftar barang...</p>
    </div>

    <!-- Daftar Barang Kasir -->
    <div id="product-list" class="space-y-2"></div>
  </main>

  <!-- Sticky Footer Total Kasir -->
  <div id="kasir-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-amber-200 p-4 shadow-2xl z-30 hidden">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-[10px] text-slate-500 uppercase font-bold">Total Transaksi</p>
        <p class="text-lg font-black text-bm-brown" id="kasir-total">Rp 0</p>
      </div>
      <button id="btn-proses" onclick="prosesTransaksi()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-5 py-3 rounded-xl shadow-md transition flex items-center gap-2 text-sm active:scale-95">
        <i class="fa-solid fa-check"></i> Process (<span id="kasir-count">0</span>)
      </button>
    </div>
  </div>

  <!-- Modal Camera Scanner -->
  <div id="modal-scanner" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-3xl p-4 shadow-2xl text-center">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-bm-brown text-sm">Scan Barcode SKU</h3>
        <button onclick="tutupKameraScanner()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="reader" class="w-full overflow-hidden rounded-2xl bg-black"></div>
      <p class="text-[11px] text-slate-500 mt-3">Arahkan kamera ke barcode produk</p>
    </div>
  </div>

  <script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx7iQEVKtryDmAkBojsDvoPS6faRKwpTfdY4Is6LvE2nirmPqKXZ4SAyddwGeI7tVEK/exec"; 

  let allProducts = [];
  let cart = {};
  let modeAksi = "kasir"; // "kasir" atau "restock"
  let html5QrcodeScanner = null;

  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      allProducts = data.map((item, index) => {
        const idUnik = (item.SKU && item.SKU !== 'NO-SKU' && item.SKU.trim() !== '') 
          ? item.SKU.toString().trim() 
          : 'PROD_' + index;
        return { ...item, idUnik: idUnik };
      });
      document.getElementById("loading").classList.add("hidden");
      renderProduk(allProducts);
    })
    .catch(err => {
      document.getElementById("loading").innerHTML = `<p class="text-xs text-rose-500 font-semibold">Gagal memuat data produk.</p>`;
    });

  function switchMode(mode) {
    modeAksi = mode;
    const tabKasir = document.getElementById("tab-kasir");
    const tabRestock = document.getElementById("tab-restock");
    const modeTitle = document.getElementById("mode-title");
    const modeDesc = document.getElementById("mode-desc");

    if (mode === 'kasir') {
      tabKasir.className = "py-2 rounded-lg text-xs font-black transition bg-bm-brown text-amber-400 shadow-sm flex items-center justify-center gap-1.5";
      tabRestock.className = "py-2 rounded-lg text-xs font-black transition text-bm-brown hover:bg-amber-200/50 flex items-center justify-center gap-1.5";
      modeTitle.innerText = "Mode Kasir Aktif";
      modeDesc.innerText = "Pilih/Scan barang yang dibeli pelanggan untuk memotong stok otomatis.";
    } else {
      tabRestock.className = "py-2 rounded-lg text-xs font-black transition bg-bm-brown text-amber-400 shadow-sm flex items-center justify-center gap-1.5";
      tabKasir.className = "py-2 rounded-lg text-xs font-black transition text-bm-brown hover:bg-amber-200/50 flex items-center justify-center gap-1.5";
      modeTitle.innerText = "Mode Restock Stok Aktif";
      modeDesc.innerText = "Tambah jumlah produk yang baru masuk untuk menambah stok otomatis.";
    }
    cart = {};
    updateKasirBar();
    renderProduk(allProducts);
  }

  function renderProduk(list) {
    const container = document.getElementById("product-list");
    container.innerHTML = "";

    if (list.length === 0) {
      container.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">Produk tidak ditemukan.</p>`;
      return;
    }

    list.forEach(item => {
      const qty = cart[item.idUnik] ? cart[item.idUnik].qty : 0;
      const card = document.createElement("div");
      card.className = "bg-white p-3 rounded-xl border border-amber-200 shadow-sm flex items-center justify-between gap-2";

      card.innerHTML = `
        <div class="flex-1 min-w-0">
          <p class="text-[9px] font-bold text-amber-700/60 uppercase">${item.SKU || 'NO-SKU'}</p>
          <h4 class="font-bold text-xs text-bm-brown truncate">${item.Nama}</h4>
          <p class="text-[10px] text-slate-500">Stok: <span class="font-bold text-bm-brown">${item.Stok}</span> | Rp ${Number(item.Harga).toLocaleString('id-ID')}</p>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          ${qty > 0 ? `
            <button onclick="updateQty('${item.idUnik}', -1)" class="w-7 h-7 bg-amber-100 text-bm-brown rounded-lg font-bold text-xs hover:bg-amber-200">-</button>
            <span class="text-xs font-extrabold px-1">${qty}</span>
          ` : ''}
          <button onclick="updateQty('${item.idUnik}', 1)" class="w-7 h-7 bg-amber-400 text-bm-brown rounded-lg font-bold text-xs hover:bg-amber-500">+</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function updateQty(idUnik, change) {
    const item = allProducts.find(p => p.idUnik === idUnik);
    if (!item) return;

    if (!cart[idUnik]) cart[idUnik] = { ...item, qty: 0 };
    cart[idUnik].qty += change;

    if (cart[idUnik].qty <= 0) delete cart[idUnik];

    updateKasirBar();
    renderProduk(allProducts);
  }

  function filterProduk() {
    const q = document.getElementById("search").value.toLowerCase();
    const filtered = allProducts.filter(p => p.Nama.toLowerCase().includes(q) || (p.SKU && p.SKU.toLowerCase().includes(q)));
    renderProduk(filtered);
  }

  function updateKasirBar() {
    let total = 0;
    let count = 0;
    Object.values(cart).forEach(i => {
      total += i.Harga * i.qty;
      count += i.qty;
    });

    const kasirBar = document.getElementById("kasir-bar");
    if (count > 0) {
      kasirBar.classList.remove("hidden");
      document.getElementById("kasir-count").innerText = count;
      document.getElementById("kasir-total").innerText = "Rp " + total.toLocaleString('id-ID');
    } else {
      kasirBar.classList.add("hidden");
    }
  }

  function prosesTransaksi() {
    const btn = document.getElementById("btn-proses");
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Memproses...`;

    const itemsToSend = [];
    Object.values(cart).forEach(i => {
      itemsToSend.push({ sku: i.SKU, nama: i.Nama, qty: i.qty });
    });

    fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        tipe: modeAksi === "kasir" ? "Kasir Scan" : "Restock Manual",
        items: itemsToSend,
        pemesan: {
          nama: modeAksi === "kasir" ? "Kasir / Langsung" : "Restock Gudang",
          lokasi: "Toko Utama"
        }
      })
    }).finally(() => {
      alert("Transaksi berhasil dicatat!");
      cart = {};
      updateKasirBar();
      location.reload();
    });
  }

  function bukaKameraScanner() {
    document.getElementById("modal-scanner").classList.remove("hidden");
    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 200, height: 200 } },
      (decodedText) => {
        const item = allProducts.find(p => p.SKU && p.SKU.trim() === decodedText.trim());
        if (item) {
          updateQty(item.idUnik, 1);
          tutupKameraScanner();
        } else {
          alert("Barang dengan SKU: " + decodedText + " tidak ditemukan!");
        }
      },
      (error) => {}
    );
  }

  function tutupKameraScanner() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        document.getElementById("modal-scanner").classList.add("hidden");
      }).catch(() => {
        document.getElementById("modal-scanner").classList.add("hidden");
      });
    } else {
      document.getElementById("modal-scanner").classList.add("hidden");
    }
  }
  </script>
</body>
</html>
