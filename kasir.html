<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasir Scan Barcode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library Scan Barcode Kamera Gratis -->
    <script src="https://unpkg.com/html5-qrcode"></script>
  </head>
  <body class="bg-slate-100 p-4 min-h-screen">
    <div class="max-w-md mx-auto bg-white p-5 rounded-xl shadow-lg">
      <h1 class="text-xl font-bold text-center mb-4 text-slate-800">
        📷 Kasir Scan Toko
      </h1>

      <!-- Area Scanner Kamera -->
      <div
        id="reader"
        class="w-full bg-black rounded-lg overflow-hidden mb-4"
      ></div>

      <!-- Status Output -->
      <div
        id="status"
        class="text-center font-semibold text-sm p-3 mb-4 rounded-lg bg-gray-100 text-gray-700"
      >
        Arahkan kamera ke Barcode / QR
      </div>

      <!-- Log Scan Terakhir -->
      <div
        id="result-box"
        class="hidden border border-green-200 bg-green-50 p-4 rounded-lg mb-4"
      >
        <p class="text-xs text-green-600 font-bold uppercase">
          Berhasil Dipotong!
        </p>
        <p id="scanned-sku" class="text-sm font-bold text-slate-800"></p>
        <p id="scanned-stok" class="text-xs text-slate-600"></p>
      </div>
    </div>

    <script>
      // ⚠️ GANTI DENGEN URL WEB APP APPS SCRIPT KAMU YANG AKHIRAN /exec
      const API_URL = "https://script.google.com/macros/s/AKfycbwuknAge8TBp17gvaqB3KGIKFEFWiYacghiDiXK3uTIXrhwfvfOtAIyKkf71u4rN0KV/exec";

      let isProcessing = false;

      function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;

        const statusEl = document.getElementById("status");
        statusEl.className =
          "text-center font-semibold text-sm p-3 mb-4 rounded-lg bg-yellow-100 text-yellow-800";
        statusEl.innerText = `Memproses SKU: ${decodedText}...`;

        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ sku: decodedText, qty: 1 }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              statusEl.className =
                "text-center font-semibold text-sm p-3 mb-4 rounded-lg bg-green-100 text-green-800";
              statusEl.innerText = "Stok Berhasil Berkurang!";

              document.getElementById("result-box").classList.remove("hidden");
              document.getElementById("scanned-sku").innerText =
                "SKU: " + data.sku;
              document.getElementById("scanned-stok").innerText =
                "Sisa Stok di Database: " + data.sisaStok;
            } else {
              statusEl.className =
                "text-center font-semibold text-sm p-3 mb-4 rounded-lg bg-red-100 text-red-800";
              statusEl.innerText = "Gagal: " + data.message;
            }
          })
          .catch((err) => {
            statusEl.className =
              "text-center font-semibold text-sm p-3 mb-4 rounded-lg bg-red-100 text-red-800";
            statusEl.innerText = "Error koneksi / server.";
          })
          .finally(() => {
            setTimeout(() => {
              isProcessing = false;
            }, 2000); // Delay 2 detik agar tidak ter-scan ganda
          });
      }

      const html5QrcodeScanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: { width: 250, height: 150 },
      });
      html5QrcodeScanner.render(onScanSuccess);
    </script>
  </body>
</html>
