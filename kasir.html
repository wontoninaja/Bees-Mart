<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Bee's Mart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-32">

  <!-- Header dengan Tombol Kembali ke Katalog -->
  <header class="bg-yellow-500 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <!-- Tombol Kembali ke index.html -->
      <a href="index.html" class="w-9 h-9 bg-yellow-600 hover:bg-yellow-700 active:scale-95 rounded-lg flex items-center justify-center text-white transition shadow" title="Kembali ke Katalog">
        <i class="fa-solid fa-arrow-left text-lg"></i>
      </a>
      <h1 class="text-lg font-bold flex items-center gap-2">
        <i class="fa-solid fa-cash-register"></i> Kasir Bee's Mart
      </h1>
    </div>
    <button onclick="fetchProducts()" class="text-xs bg-yellow-600 hover:bg-yellow-700 px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
      <i class="fa-solid fa-rotate" id="icon-refresh"></i> Refresh
    </button>
  </header>

  <!-- Mode Switcher -->
  <div class="max-w-md mx-auto m-4 bg-white p-2 rounded-xl shadow flex gap-2">
    <button id="btn-mode-kasir" onclick="switchMode('kasir')" class="flex-1 py-2 font-bold rounded-lg bg-yellow-500 text-white transition">
      <i class="fa-solid fa-cart-shopping mr-1"></i> Mode Kasir
    </button>
    <button id="btn-mode-restock" onclick="switchMode('restock')" class="flex-1 py-2 font-bold rounded-lg bg-gray-200 text-gray-700 transition">
      <i class="fa-solid fa-boxes-packing mr-1"></i> Tambah Stok
    </button>
  </div>

  <main class="max-w-md mx-auto px-4">
    
    <!-- Scanner Section -->
    <div class="bg-white p-4 rounded-xl shadow mb-4">
      <div id="reader" class="w-full rounded-lg overflow-hidden bg-gray-900 min-h-[160px] flex items-center justify-center text-white text-sm">
        <span>Kamera Scanner Siap...</span>
      </div>
      <div class="mt-3">
        <button id="btn-toggle-cam" onclick="toggleCamera()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-camera"></i> <span id="cam-action-text">Mulai Scanner</span>
        </button>
      </div>
    </div>

    <!-- Filter & Cari Barang -->
    <div class="bg-white p-4 rounded-xl shadow mb-4">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
        <input type="text" id="search-input" onkeyup="renderProductList()" placeholder="Cari nama atau SKU barang..." class="w-full pl-9 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 text-sm">
      </div>
    </div>

    <!-- Daftar Semua Barang -->
    <div class="bg-white p-4 rounded-xl shadow mb-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-gray-800" id="section-title">Daftar Barang (Kasir)</h2>
        <span id="total-items-badge" class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full font-semibold">0 Barang</span>
      </div>

      <!-- Container Item List -->
      <div id="product-list-container" class="space-y-3">
        <div class="text-center py-8 text-gray-400 text-sm">
          <i class="fa-solid fa-spinner animate-spin text-2xl mb-2 text-yellow-500"></i>
          <p>Memuat daftar barang...</p>
        </div>
      </div>
    </div>

  </main>

  <!-- Sticky Bottom Checkout Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 max-w-md mx-auto shadow-2xl z-40">
    <div class="flex justify-between items-center mb-2" id="summary-container">
      <span class="text-gray-600 font-semibold text-sm">Total Dipilih:</span>
      <span class="text-lg font-bold text-green-600" id="grand-total-text">Rp0</span>
    </div>

    <button id="btn-submit" onclick="prosesSelesai()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-check-circle text-lg"></i> <span id="btn-submit-text">Selesaikan Transaksi</span>
    </button>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbx7iQEVKtryDmAkBojsDvoPS6faRKwpTfdY4Is6LvE2nirmPqKXZ4SAyddwGeI7tVEK/exec"; 

    let allProducts = [];
    let cart = {}; // Simpan qty belanjaan di memori HP: { "SKU/NAMA": qty }
    let currentMode = 'kasir'; // 'kasir' / 'restock'
    let html5QrcodeScanner = null;
    let isScanning = false;

    window.onload = function() {
      fetchProducts();
    };

    function fetchProducts() {
      const icon = document.getElementById("icon-refresh");
      if(icon) icon.classList.add("animate-spin");

      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          allProducts = data;
          renderProductList();
        })
        .catch(err => {
          alert("Gagal memuat data barang: " + err);
        })
        .finally(() => {
          if(icon) icon.classList.remove("animate-spin");
        });
    }

    function switchMode(mode) {
      currentMode = mode;
      const btnKasir = document.getElementById("btn-mode-kasir");
      const btnRestock = document.getElementById("btn-mode-restock");
      const secTitle = document.getElementById("section-title");
      const btnSubmitText = document.getElementById("btn-submit-text");
      const summaryContainer = document.getElementById("summary-container");

      if (mode === 'kasir') {
        btnKasir.className = "flex-1 py-2 font-bold rounded-lg bg-yellow-500 text-white transition";
        btnRestock.className = "flex-1 py-2 font-bold rounded-lg bg-gray-200 text-gray-700 transition";
        secTitle.innerText = "Daftar Barang (Kasir)";
        btnSubmitText.innerText = "Selesaikan Transaksi";
        summaryContainer.style.display = "flex";
      } else {
        btnRestock.className = "flex-1 py-2 font-bold rounded-lg bg-blue-600 text-white transition";
        btnKasir.className = "flex-1 py-2 font-bold rounded-lg bg-gray-200 text-gray-700 transition";
        secTitle.innerText = "Daftar Barang (Restock)";
        btnSubmitText.innerText = "Simpan Restock Stok";
        summaryContainer.style.display = "none";
      }
      renderProductList();
    }

    function renderProductList() {
      const container = document.getElementById("product-list-container");
      const searchKeyword = document.getElementById("search-input").value.toLowerCase().trim();

      let filtered = allProducts.filter(p => 
        p.Nama.toLowerCase().includes(searchKeyword) || 
        (p.SKU && p.SKU.toLowerCase().includes(searchKeyword))
      );

      document.getElementById("total-items-badge").innerText = `${filtered.length} Barang`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-gray-400 text-sm">Barang tidak ditemukan.</div>`;
        updateGrandTotal();
        return;
      }

      let html = "";
      filtered.forEach(p => {
        const key = p.SKU || p.Nama;
        const currentQty = cart[key] || 0;

        html += `
          <div class="flex items-center justify-between p-3 rounded-lg border border-gray-200 ${currentQty > 0 ? 'bg-yellow-50 border-yellow-300' : 'bg-gray-50'} transition">
            <div class="flex-1 pr-2">
              <div class="font-bold text-gray-800 text-sm">${p.Nama}</div>
              <div class="text-xs text-gray-500 mt-0.5">
                ${currentMode === 'kasir' ? 'Rp' + p.Harga.toLocaleString('id-ID') + ' | ' : ''}
                <span class="${p.Stok <= 0 ? 'text-red-500 font-bold' : ''}">Stok: ${p.Stok}</span>
              </div>
            </div>

            <!-- Tombol Counter dengan Input Angka Ketik Manual -->
            <div class="flex items-center gap-1">
              ${currentQty > 0 ? `
                <button onclick="updateQty('${key}', -1)" class="w-8 h-8 rounded-lg bg-red-100 text-red-600 font-bold hover:bg-red-200 active:scale-90 transition flex items-center justify-center">
                  -
                </button>
              ` : ''}

              <input type="number" min="0" value="${currentQty}" 
                onchange="setManualQty('${key}', this.value)" 
                onfocus="this.select()"
                class="w-12 h-8 text-center font-bold text-sm text-gray-800 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">

              <button onclick="updateQty('${key}', 1)" class="w-8 h-8 rounded-lg ${currentQty > 0 ? 'bg-yellow-500 text-white' : 'bg-gray-200 text-gray-700'} font-bold hover:bg-yellow-600 active:scale-90 transition flex items-center justify-center">
                +
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      updateGrandTotal();
    }

    // Fungsi Pengubah Kuantitas Lewat Tombol (+/-)
    function updateQty(key, delta) {
      if (!cart[key]) cart[key] = 0;
      cart[key] += delta;

      if (cart[key] <= 0) {
        delete cart[key];
      }

      renderProductList();
    }

    // Fungsi Pengubah Kuantitas Lewat Ketik Manual di Input
    function setManualQty(key, value) {
      let val = parseInt(value) || 0;
      if (val <= 0) {
        delete cart[key];
      } else {
        cart[key] = val;
      }
      renderProductList();
    }

    function updateGrandTotal() {
      let total = 0;
      Object.keys(cart).forEach(key => {
        let p = allProducts.find(item => (item.SKU || item.Nama) === key);
        if (p) {
          total += (p.Harga * cart[key]);
        }
      });
      document.getElementById("grand-total-text").innerText = "Rp" + total.toLocaleString('id-ID');
    }

    // Camera Scan Logika
    function toggleCamera() {
      const actionText = document.getElementById("cam-action-text");
      if (isScanning) {
        html5QrcodeScanner.stop().then(() => {
          isScanning = false;
          actionText.innerText = "Mulai Scanner";
          document.getElementById("reader").innerHTML = `<span>Kamera Diberhentikan</span>`;
        });
      } else {
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 130 } },
          onScanSuccess
        ).then(() => {
          isScanning = true;
          actionText.innerText = "Hentikan Scanner";
        }).catch(err => alert("Gagal mengaktifkan kamera: " + err));
      }
    }

    function onScanSuccess(decodedText) {
      let found = allProducts.find(p => p.SKU && p.SKU.toString().trim() === decodedText.trim());
      if (found) {
        const key = found.SKU || found.Nama;
        updateQty(key, 1);
      } else {
        alert("Barang dengan Barcode " + decodedText + " tidak ditemukan!");
      }
    }

    // Kirim Data Batch ke Google Sheets saat "Selesaikan Transaksi" diklik
    function prosesSelesai() {
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        alert("Belum ada barang yang dipilih!");
        return;
      }

      const btnSubmit = document.getElementById("btn-submit");
      btnSubmit.disabled = true;
      btnSubmit.classList.add("opacity-50");
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Memproses...`;

      const itemsToSend = keys.map(k => {
        let p = allProducts.find(item => (item.SKU || item.Nama) === k);
        return {
          sku: p ? p.SKU : k,
          nama: p ? p.Nama : k,
          qty: cart[k]
        };
      });

      const payload = {
        tipe: currentMode === 'kasir' ? "Kasir Scan" : "Restock Barang",
        items: itemsToSend
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert(currentMode === 'kasir' ? "Transaksi Kasir Berhasil!" : "Restock Berhasil!");
        cart = {};
        fetchProducts(); // Auto reload stok terbaru dari spreadsheet
      })
      .catch(err => {
        alert("Gagal memperbarui stok: " + err);
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove("opacity-50");
        switchMode(currentMode);
      });
    }
  </script>
</body>
</html>
